[build]
  publish = "."
  # Kein Build-Command nötig - nur statisches HTML

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirects für saubere URLs
[[redirects]]
  from = "/schulung"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/audit-training"
  to = "/index.html"
  status = 200

# Sicherheitsnetz: alte/falsch geschriebene Links auf den Abschlusstest
# (Netlify unterscheidet Groß-/Kleinschreibung - lokal auf Windows/Mac nicht!)
[[redirects]]
  from = "/Abschlusstest.html"
  to = "/abschlusstest.html"
  status = 301

[[redirects]]
  from = "/abschlusstest"
  to = "/abschlusstest.html"
  status = 200

[[redirects]]
  from = "/test"
  to = "/abschlusstest.html"
  status = 200
